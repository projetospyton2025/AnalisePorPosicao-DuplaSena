{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">📊 Análise Por Posição</h2>
    </div>
</div>

<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Configurar Análise</h5>
            </div>
            <div class="card-body">
                <form id="form-analise">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tipo de Busca</label>
                            <select class="form-select" id="tipo-busca">
                                <option value="ultimos">Últimos N concursos</option>
                                <option value="intervalo">Intervalo de concursos</option>
                            </select>
                        </div>
                        
                        <div class="col-md-8">
                            <div id="opcao-ultimos">
                                <label class="form-label">Quantidade de Concursos</label>
                                <input type="number" class="form-control" id="quantidade" value="50" min="1" max="500">
                            </div>
                            
                            <div id="opcao-intervalo" style="display: none;">
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-label">Concurso Inicial</label>
                                        <input type="number" class="form-control" id="inicio" min="1">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Concurso Final</label>
                                        <input type="number" class="form-control" id="fim" min="1">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-lg">
                                🔍 Analisar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="loading" style="display: none;" class="text-center my-5">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Analisando...</span>
    </div>
    <p class="mt-3">Buscando e analisando concursos...</p>
</div>

<div id="resultado" style="display: none;">
    <div class="row mb-4">
        <div class="col-12">
            <div class="alert alert-success">
                <strong>✅ Análise Concluída!</strong>
                <span id="total-concursos"></span>
            </div>
        </div>
    </div>
    
    <ul class="nav nav-tabs mb-4" id="sorteioTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="sorteio1-tab" data-bs-toggle="tab" data-bs-target="#sorteio1" type="button">
                1º Sorteio
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="sorteio2-tab" data-bs-toggle="tab" data-bs-target="#sorteio2" type="button">
                2º Sorteio
            </button>
        </li>
    </ul>
    
    <div class="tab-content" id="sorteioTabContent">
        <div class="tab-pane fade show active" id="sorteio1" role="tabpanel">
            <div id="analise-sorteio1"></div>
            <div class="card mt-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">🎯 Sugestões - 1º Sorteio</h5>
                </div>
                <div class="card-body">
                    <div id="sugestoes-sorteio1"></div>
                </div>
            </div>
        </div>
        
        <div class="tab-pane fade" id="sorteio2" role="tabpanel">
            <div id="analise-sorteio2"></div>
            <div class="card mt-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">🎯 Sugestões - 2º Sorteio</h5>
                </div>
                <div class="card-body">
                    <div id="sugestoes-sorteio2"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/analise.js') }}"></script>
{% endblock %}
